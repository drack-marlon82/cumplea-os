<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feliz Cumpleaños</title>
  <style>
    body {
      background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #message {
      display: none; /* Inicialmente oculto */
      font-size: 1.5em;
      color: #fff;
      text-align: center;
      margin-top: 20px;
      max-width: 80%;
    }
    button {
      padding: 10px 20px;
      font-size: 1.2em;
      cursor: pointer;
      background-color: #fff;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>¡Feliz Cumpleaños!</h1>

  <!-- Aquí se mostrará el mensaje personalizado -->
  <div id="message">
    <p id="customMessage"></p>
  </div>

  <button id="showMessageButton">Ver mensaje</button>

  <script>
    // Cambia este mensaje por el que deseas que vea tu novia
    var mensajePersonalizado = "Aquí va tu mensaje especial, mi amor. Espero que tengas un día maravilloso lleno de alegría y sorpresas.";

    // Inserta el mensaje personalizado en el párrafo
    document.getElementById("customMessage").textContent = mensajePersonalizado;

    // Al hacer clic en el botón, se muestra el mensaje y se oculta el botón
    document.getElementById("showMessageButton").addEventListener("click", function() {
      document.getElementById("message").style.display = "block";
      this.style.display = "none"; // Oculta el botón después de mostrar el mensaje
    });
  </script>
</body>
</html>
